name: career-navigation

services:
  career-navigation:
    build: .
    image: career-navigation:0.7.1
    container_name: career-navigation
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: career-navigation-api:0.7.1
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      PORT: "8787"
      DATABASE_PATH: /data/career.db
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      CAREER_INVITED_EMAILS: ${CAREER_INVITED_EMAILS:-}
      CAREER_TEACHER_EMAILS: ${CAREER_TEACHER_EMAILS:-}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-local}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - career-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  career-data:
